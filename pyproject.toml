[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-forecasting"
version = "0.1.0"
description = "Leakage-aware machine-learning baseline for traffic-volume forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["traffic_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-forecasting"
version = "0.2.0"
description = "Comparative ML/DL/spatiotemporal framework for multi-junction traffic forecasting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
benchmark = [
  "xgboost>=3.4,<4",
  "lightgbm>=4.7,<5",
  "torch>=2.14,<3",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["traffic_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
